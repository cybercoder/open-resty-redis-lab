services:
  redis:
    image: redis:7
    # command: /bin/sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data
    networks:
      - openresty_network
  openresty:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: openresty
    ports:
      - "8080:80"
    command:
      - /bin/sh
      - -c
      - |
        printenv | awk -F= '{print "env "$1";"}' > /env_vars.conf
        cat /env_vars.conf
        echo "after cat."
        /usr/local/openresty/bin/openresty -g "daemon off;"

    volumes:
      - ./config/nginx.conf.dev:/usr/local/openresty/nginx/conf/nginx.conf
      - ./app:/app
      - ./cache:/disk-cache
      - ./maxminddb:/maxminddb
      - ./tls:/app/tls/
    environment:
      - DNS_SERVERS=8.8.4.4,8.8.8.8
      - REDIS_PASSWORD=
      # - REDIS_HOST=192.168.251.11
      - HOSTNAME=cybercoders-Mac-mini
      - CYBERCODERS_MAC_MINI=192.168.251.11
      - REDIS_TIMEOUT=3000
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - openresty_network
networks:
  openresty_network:
    driver: bridge
